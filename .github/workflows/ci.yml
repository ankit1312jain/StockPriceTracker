name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone | head -20

      - name: Run unit tests
        run: |
          set -o pipefail
          # Pick an available iPhone simulator by UDID instead of pinning a
          # device name, which changes with every Xcode / runner image update.
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ids = [d["udid"] for rt in sorted(data) for d in data[rt] if "iPhone" in d["name"]]
          print(ids[-1] if ids else "")
          ')
          if [ -z "$DEVICE_ID" ]; then
            echo "No iPhone simulator available on this runner:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator UDID: $DEVICE_ID"
          xcodebuild test \
            -project StockPriceTracker.xcodeproj \
            -scheme StockPriceTracker \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
